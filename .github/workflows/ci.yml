name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desco_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d desco_nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/desco_nexus_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/desco_nexus_test?schema=public"
      SESSION_SECRET: "ci-only-session-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start server and run integration tests
        run: |
          set -euo pipefail
          npm run start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != true ]; then
            cat server.log
            exit 1
          fi
          curl -sfI http://localhost:3000/ | grep -qi "content-security-policy:"
          curl -sf http://localhost:3000/robots.txt | grep -q "Sitemap:"
          curl -sf http://localhost:3000/sitemap.xml | grep -q "<urlset"
          CROSS_SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Origin: https://attacker.invalid" \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://localhost:3000/api/contact)
          test "$CROSS_SITE_STATUS" = "403"
          node --test tests/api.test.mjs
